spring.application.name=insurance-assistant

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:insurance_assistant}?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate creates/updates tables from the entities - fine for a portfolio
# project. A real production app would use Flyway/Liquibase migrations instead.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# data.sql runs after Hibernate has created the schema, so the sample data
# insert doesn't fail with "table doesn't exist yet".
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# --- AI assistant ---
# Groq exposes an OpenAI-compatible API, so we reuse Spring AI's OpenAI
# starter and just point it at Groq's endpoint and model instead of
# OpenAI's. GROQ_MODEL is overridable in case this model gets deprecated -
# Groq's lineup changes fairly often.
spring.ai.openai.api-key=${GROQ_API_KEY:}
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.chat.options.model=${GROQ_MODEL:openai/gpt-oss-120b}

# --- Vector store (RAG) ---
# A second, separate database from the MySQL one above - see
# DataSourceConfig for why this app has two DataSources. Naming matches
# the VECTOR_DB_* convention used elsewhere in this project's docs.
app.vector-datasource.url=jdbc:postgresql://${VECTOR_DB_HOST:localhost}:${VECTOR_DB_PORT:5433}/${VECTOR_DB_NAME:insurance_vectors}
app.vector-datasource.username=${VECTOR_DB_USERNAME:postgres}
app.vector-datasource.password=${VECTOR_DB_PASSWORD:}
app.vector-datasource.driver-class-name=org.postgresql.Driver
